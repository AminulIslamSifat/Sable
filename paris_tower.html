<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🗼 Eiffel Tower — 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3e 50%, #2d1b4e 100%);
overflow: hidden;
font-family: 'Segoe UI', system-ui, sans-serif;
color: #e0d6ff;
}
#canvas-container { width: 100vw; height: 100vh; position: relative; }
canvas { display: block; }

/* Controls Panel */
.controls {
position: absolute;
top: 20px;
right: 20px;
background: rgba(15, 15, 35, 0.75);
backdrop-filter: blur(12px);
border: 1px solid rgba(180, 160, 255, 0.15);
border-radius: 14px;
padding: 18px 22px;
min-width: 220px;
z-index: 10;
transition: opacity 0.3s;
}
.controls:hover { opacity: 1 !important; }
.controls h3 {
font-size: 13px;
text-transform: uppercase;
letter-spacing: 1.5px;
margin-bottom: 14px;
color: #c9b8ff;
font-weight: 600;
}
.ctrl-row {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 10px;
font-size: 13px;
}
.ctrl-row label { color: #a89cc8; }
.btn {
background: rgba(180, 160, 255, 0.12);
border: 1px solid rgba(180, 160, 255, 0.25);
color: #d4c8ff;
padding: 6px 14px;
border-radius: 8px;
cursor: pointer;
font-size: 12px;
transition: all 0.2s;
}
.btn:hover {
background: rgba(180, 160, 255, 0.25);
border-color: rgba(180, 160, 255, 0.5);
transform: translateY(-1px);
}
input[type="range"] {
-webkit-appearance: none;
appearance: none;
width: 100px;
height: 4px;
background: rgba(180, 160, 255, 0.2);
border-radius: 2px;
outline: none;
}
input[type="range"]::-webkit-slider-thumb {
-webkit-appearance: none;
appearance: none;
width: 14px;
height: 14px;
background: #b4a0ff;
border-radius: 50%;
cursor: pointer;
box-shadow: 0 0 6px rgba(180, 160, 255, 0.5);
}
.toggle-wrap {
display: flex;
gap: 8px;
flex-wrap: wrap;
margin-top: 4px;
}
.toggle-btn {
background: rgba(180, 160, 255, 0.08);
border: 1px solid rgba(180, 160, 255, 0.18);
color: #9a8cbf;
padding: 5px 10px;
border-radius: 6px;
cursor: pointer;
font-size: 11px;
transition: all 0.2s;
}
.toggle-btn.active {
background: rgba(180, 160, 255, 0.22);
border-color: rgba(180, 160, 255, 0.5);
color: #d4c8ff;
box-shadow: 0 0 8px rgba(180, 160, 255, 0.2);
}
.toggle-btn:hover {
border-color: rgba(180, 160, 255, 0.4);
}

/* Info badge */
.info-badge {
position: absolute;
bottom: 20px;
left: 20px;
background: rgba(15, 15, 35, 0.6);
backdrop-filter: blur(8px);
border: 1px solid rgba(180, 160, 255, 0.1);
border-radius: 10px;
padding: 10px 16px;
font-size: 11px;
color: #8a7daa;
z-index: 10;
line-height: 1.6;
}
.info-badge span { color: #c9b8ff; font-weight: 500; }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div class="controls" style="opacity:0.85">
<h3>🗼 Controls</h3>
<div class="ctrl-row">
<label>Rotate Speed</label>
<input type="range" id="rotSpeed" min="0" max="5" step="0.1" value="0.5"/>
</div>
<div class="ctrl-row">
<label>Zoom</label>
<input type="range" id="zoomCtrl" min="3" max="25" step="0.5" value="12"/>
</div>
<div class="toggle-wrap">
<button class="toggle-btn active" data-toggle="wireframe">Wireframe</button>
<button class="toggle-btn active" data-toggle="lights">Lights</button>
<button class="toggle-btn" data-toggle="autoRotate">Auto Spin</button>
</div>
<div style="margin-top:12px; display:flex; gap:8px;">
<button class="btn" id="resetBtn">↺ Reset</button>
<button class="btn" id="topViewBtn">⬆ Top</button>
</div>
</div>

<div class="info-badge">
<span>Eiffel Tower</span> · 330m tall · Built 1889<br/>
Drag to rotate · Scroll to zoom · Right-drag to pan
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Scene Setup ────────────────────────────────────────
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.018);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(8, 6, 12);
camera.lookAt(0, 3, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// ─── Orbit Controls (manual) ────────────────────────────
let isDragging = false, isPanning = false;
let prevMouse = { x: 0, y: 0 };
let spherical = { theta: Math.atan2(camera.position.x, camera.position.z), phi: Math.acos(camera.position.y / camera.position.length()), radius: camera.position.length() };
let target = new THREE.Vector3(0, 3, 0);

function updateCameraFromSpherical() {
spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
spherical.radius = Math.max(3, Math.min(25, spherical.radius));
camera.position.x = target.x + spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
camera.position.y = target.y + spherical.radius * Math.cos(spherical.phi);
camera.position.z = target.z + spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
camera.lookAt(target);
}

renderer.domElement.addEventListener('mousedown', e => {
if (e.button === 0) isDragging = true;
if (e.button === 2) isPanning = true;
prevMouse = { x: e.clientX, y: e.clientY };
});
window.addEventListener('mouseup', () => { isDragging = false; isPanning = false; });
window.addEventListener('mousemove', e => {
const dx = e.clientX - prevMouse.x, dy = e.clientY - prevMouse.y;
if (isDragging) {
spherical.theta -= dx * 0.005;
spherical.phi += dy * 0.005;
updateCameraFromSpherical();
} else if (isPanning) {
const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), camera.getWorldDirection(new THREE.Vector3())).normalize();
const up = new THREE.Vector3(0,1,0);
target.addScaledVector(right, -dx * 0.01);
target.addScaledVector(up, dy * 0.01);
updateCameraFromSpherical();
}
prevMouse = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('wheel', e => {
e.preventDefault();
spherical.radius += e.deltaY * 0.01;
updateCameraFromSpherical();
document.getElementById('zoomCtrl').value = spherical.radius.toFixed(1);
}, { passive: false });
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

// Touch support
let touchStart = null, lastTouchDist = 0;
renderer.domElement.addEventListener('touchstart', e => {
if (e.touches.length === 1) {
isDragging = true;
prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
} else if (e.touches.length === 2) {
lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
}
});
renderer.domElement.addEventListener('touchmove', e => {
e.preventDefault();
if (e.touches.length === 1 && isDragging) {
const dx = e.touches[0].clientX - prevMouse.x, dy = e.touches[0].clientY - prevMouse.y;
spherical.theta -= dx * 0.005;
spherical.phi += dy * 0.005;
updateCameraFromSpherical();
prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
} else if (e.touches.length === 2) {
const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
spherical.radius *= lastTouchDist / dist;
updateCameraFromSpherical();
lastTouchDist = dist;
}
}, { passive: false });
renderer.domElement.addEventListener('touchend', () => { isDragging = false; });

// ─── Materials ──────────────────────────────────────────
const ironMat = new THREE.MeshStandardMaterial({ color: 0x8B7355, metalness: 0.7, roughness: 0.4, wireframe: true });
const lightMat = new THREE.MeshBasicMaterial({ color: 0xFFE4A0, transparent: true, opacity: 0.9 });
const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.9 });
const grassMat = new THREE.MeshStandardMaterial({ color: 0x1a3a1a, roughness: 0.8 });

// ─── Build the Tower ────────────────────────────────────
const towerGroup = new THREE.Group();

function createLatticeSection(yBottom, yTop, wBottom, wTop, segments) {
const group = new THREE.Group();
const h = yTop - yBottom;
const segH = h / segments;
for (let s = 0; s < segments; s++) {
const t0 = s / segments, t1 = (s + 1) / segments;
const wb = wBottom + (wTop - wBottom) * t0;
const wt = wBottom + (wTop - wBottom) * t1;
const yb = yBottom + segH * s;
const yt = yb + segH;

// Vertical corner posts
const corners = [[-wb,-wb],[wb,-wb],[wb,wb],[-wb,wb]];
const topCorners = [[-wt,-wt],[wt,-wt],[wt,wt],[-wt,wt]];
for (let c = 0; c < 4; c++) {
const geo = new THREE.CylinderGeometry(0.04, 0.04, segH, 4);
const mesh = new THREE.Mesh(geo, ironMat);
mesh.position.set((corners[c][0]+topCorners[c][0])/2, yb + segH/2, (corners[c][1]+topCorners[c][1])/2);
group.add(mesh);
}

// Horizontal rings at bottom & top of segment
for (const [y, w] of [[yb, wb], [yt, wt]]) {
for (let axis = 0; axis < 2; axis++) {
const len = w * 2;
const geo = new THREE.BoxGeometry(axis===0 ? len : 0.03, 0.03, axis===1 ? len : 0.03);
const mesh = new THREE.Mesh(geo, ironMat);
mesh.position.set(0, y, 0);
group.add(mesh);
}
}

// X-bracing on each face
const faces = [
{ normal: [0,0,-1], offset: [-wb, yb+segH/2, -wb], size: [wb*2, segH] },
{ normal: [0,0,1], offset: [wb, yb+segH/2, wb], size: [wb*2, segH] },
{ normal: [-1,0,0], offset: [-wb, yb+segH/2, -wb], size: [wb*2, segH] },
{ normal: [1,0,0], offset: [wb, yb+segH/2, wb], size: [wb*2, segH] },
];
for (const f of faces) {
const diagLen = Math.sqrt(f.size[0]**2 + f.size[1]**2);
const angle = Math.atan2(f.size[1], f.size[0]);
for (const sign of [1, -1]) {
const geo = new THREE.CylinderGeometry(0.02, 0.02, diagLen, 3);
const mesh = new THREE.Mesh(geo, ironMat);
mesh.rotation.z = sign * angle;
if (Math.abs(f.normal[2]) > 0.5) {
mesh.position.set(f.offset[0], f.offset[1], f.offset[2]);
mesh.rotation.y = 0;
} else {
mesh.position.set(f.offset[0], f.offset[1], f.offset[2]);
mesh.rotation.y = Math.PI / 2;
}
group.add(mesh);
}
}
}
return group;
}

// Four main sections with decreasing widths
towerGroup.add(createLatticeSection(0, 2, 2.0, 1.4, 4)); // base legs
towerGroup.add(createLatticeSection(2, 4.5, 1.4, 0.9, 5)); // lower mid
towerGroup.add(createLatticeSection(4.5, 7, 0.9, 0.5, 5)); // upper mid
towerGroup.add(createLatticeSection(7, 9.5, 0.5, 0.15, 4)); // spire

// Platforms
const platGeo = new THREE.CylinderGeometry(1.6, 1.6, 0.08, 4);
const plat1 = new THREE.Mesh(platGeo, ironMat); plat1.position.y = 2; towerGroup.add(plat1);
const plat2Geo = new THREE.CylinderGeometry(1.0, 1.0, 0.08, 4);
const plat2 = new THREE.Mesh(plat2Geo, ironMat); plat2.position.y = 4.5; towerGroup.add(plat2);
const plat3Geo = new THREE.CylinderGeometry(0.55, 0.55, 0.06, 4);
const plat3 = new THREE.Mesh(plat3Geo, ironMat); plat3.position.y = 7; towerGroup.add(plat3);

// Antenna/spire tip
const antennaGeo = new THREE.ConeGeometry(0.06, 1.5, 6);
const antenna = new THREE.Mesh(antennaGeo, ironMat);
antenna.position.y = 10.2;
towerGroup.add(antenna);

// Decorative arches at base
for (let i = 0; i < 4; i++) {
const archCurve = new THREE.QuadraticBezierCurve3(
new THREE.Vector3(i%2===0?-1.8:1.8, 0, i<2?-1.8:1.8),
new THREE.Vector3(i%2===0?-0.5:0.5, 1.8, i<2?-0.5:0.5),
new THREE.Vector3(i%2===0?1.8:-1.8, 0, i<2?1.8:-1.8)
);
const tubeGeo = new THREE.TubeGeometry(archCurve, 12, 0.04, 6, false);
const archMesh = new THREE.Mesh(tubeGeo, ironMat);
towerGroup.add(archMesh);
}

scene.add(towerGroup);

// ─── Ground ─────────────────────────────────────────────
const groundGeo = new THREE.CircleGeometry(20, 64);
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grass patches
for (let i = 0; i < 30; i++) {
const r = 3 + Math.random() * 15;
const a = Math.random() * Math.PI * 2;
const g = new THREE.Mesh(new THREE.SphereGeometry(0.15 + Math.random()*0.2, 6, 4), grassMat);
g.position.set(r*Math.cos(a), 0.05, r*Math.sin(a));
g.scale.y = 0.3;
scene.add(g);
}

// ─── Lights ─────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x334466, 0.4);
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0xaabbff, 0.6);
moonLight.position.set(10, 20, 5);
moonLight.castShadow = true;
scene.add(moonLight);

// Tower sparkle lights
const sparkles = [];
const sparklePositions = [];
for (let y = 0.5; y < 9.5; y += 0.4) {
const w = 2.0 - (y / 9.5) * 1.85;
for (let j = 0; j < 4; j++) {
const angle = (j / 4) * Math.PI * 2 + y * 0.3;
sparklePositions.push([w * Math.cos(angle), y, w * Math.sin(angle)]);
}
}
const sparkleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(sparklePositions.flat());
sparkleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const sparkleMat = new THREE.PointsMaterial({ color: 0xFFE4A0, size: 0.08, transparent: true, opacity: 0.8 });
const sparklePoints = new THREE.Points(sparkleGeo, sparkleMat);
scene.add(sparklePoints);

// Stars
const starCount = 500;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
starPos[i*3] = (Math.random()-0.5)*100;
starPos[i*3+1] = 20 + Math.random()*40;
starPos[i*3+2] = (Math.random()-0.5)*100;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0.7 });
scene.add(new THREE.Points(starGeo, starMat));

// ─── State ──────────────────────────────────────────────
let autoRotate = false;
let rotSpeedVal = 0.5;
let showLights = true;
let showWireframe = true;

// ─── UI Bindings ────────────────────────────────────────
document.getElementById('rotSpeed').addEventListener('input', e => {
rotSpeedVal = parseFloat(e.target.value);
});
document.getElementById('zoomCtrl').addEventListener('input', e => {
spherical.radius = parseFloat(e.target.value);
updateCameraFromSpherical();
});
document.querySelectorAll('.toggle-btn[data-toggle]').forEach(btn => {
btn.addEventListener('click', () => {
const key = btn.dataset.toggle;
btn.classList.toggle('active');
if (key === 'wireframe') {
showWireframe = btn.classList.contains('active');
ironMat.wireframe = showWireframe;
}
if (key === 'lights') {
showLights = btn.classList.contains('active');
sparklePoints.visible = showLights;
}
if (key === 'autoRotate') {
autoRotate = btn.classList.contains('active');
}
});
});
document.getElementById('resetBtn').addEventListener('click', () => {
spherical.theta = Math.atan2(8, 12);
spherical.phi = Math.acos(6 / Math.sqrt(8*8+6*6+12*12));
spherical.radius = Math.sqrt(8*8+6*6+12*12);
target.set(0, 3, 0);
updateCameraFromSpherical();
document.getElementById('zoomCtrl').value = spherical.radius.toFixed(1);
});
document.getElementById('topViewBtn').addEventListener('click', () => {
spherical.phi = 0.15;
spherical.radius = 14;
updateCameraFromSpherical();
document.getElementById('zoomCtrl').value = "14.0";
});

// ─── Animation Loop ─────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
requestAnimationFrame(animate);
const dt = clock.getDelta();
const elapsed = clock.elapsedTime;

if (autoRotate) {
spherical.theta += rotSpeedVal * dt * 0.5;
updateCameraFromSpherical();
}

// Twinkle sparkles
if (showLights) {
sparkleMat.opacity = 0.5 + 0.4 * Math.sin(elapsed * 3);
sparkleMat.size = 0.06 + 0.03 * Math.sin(elapsed * 5);
}

renderer.render(scene, camera);
}
animate();

// ─── Resize Handler ─────────────────────────────────────
window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
