<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src file: data:; script-src 'unsafe-inline'" />
<title>Sable</title>
<style>
  :root {
    --bg: #08090b;
    --panel: #12110e;
    --line: #24211b;
    --text: #eeeae2;
    --dim: #8d877c;
    --faint: #575146;
    --gold: #c9a961;
    --ok: #7dd3a0;
    --warn: #e8c07d;
    --error: #e8837d;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
    position: relative;
    padding: 16px;
  }

  .scene { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; }
  .g1 {
    width: 780px; height: 780px; top: -38%; left: 50%; margin-left: -390px;
    background: radial-gradient(circle, rgba(201,169,97,.20) 0%, rgba(201,169,97,0) 68%);
    animation: drift1 22s ease-in-out infinite alternate;
  }
  .g2 {
    width: 620px; height: 620px; bottom: -30%; right: -12%;
    background: radial-gradient(circle, rgba(125,211,160,.10) 0%, rgba(125,211,160,0) 70%);
    animation: drift2 28s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(-60px, 40px) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-50px, -60px) scale(1.08); } }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 42%, #000 20%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 42%, #000 20%, transparent 100%);
  }

  .card { position: relative; width: min(520px, 89vw); text-align: center; z-index: 1; }
  .card > * { animation: rise .62s cubic-bezier(.22,.75,.28,1) both; }
  .card > *:nth-child(1) { animation-delay: 0s; }
  .card > *:nth-child(2) { animation-delay: .07s; }
  .card > *:nth-child(3) { animation-delay: .12s; }
  .card > *:nth-child(4) { animation-delay: .17s; }
  .card > *:nth-child(5) { animation-delay: .22s; }
  .card > *:nth-child(6) { animation-delay: .27s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

  .mark {
    position: relative;
    width: 82px; height: 82px;
    margin: 0 auto 24px;
    border-radius: 23px;
    display: grid; place-items: center;
    background: linear-gradient(158deg, #1c1913 0%, #0d0c09 100%);
    border: 1px solid #2b2519;
    box-shadow:
      0 18px 54px -18px rgba(0,0,0,.95),
      inset 0 1px 0 rgba(255,255,255,.05),
      0 0 60px -22px rgba(201,169,97,.55);
  }
  .mark svg { width: 40px; height: 40px; position: relative; z-index: 2; }
  .mark::before {
    content: "";
    position: absolute; inset: -26px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.16) 0%, transparent 68%);
    animation: breathe 4.6s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  .mark::after {
    content: "";
    position: absolute; inset: -1px;
    border-radius: 23px;
    padding: 1px;
    background: conic-gradient(from 0deg, transparent 0 52%, var(--gold) 76%, transparent 88%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: .9;
    animation: spin 3.6s linear infinite;
  }
  body[data-stage="idle"] .mark::after,
  body[data-stage="error"] .mark::after { animation-play-state: paused; opacity: .3; }
  @keyframes spin { to { transform: rotate(360deg); } }

  h1 { font-size: 22px; font-weight: 600; letter-spacing: .34px; margin: 0 0 5px; }
  .sub { color: var(--dim); font-size: 12.5px; margin: 0 0 28px; letter-spacing: .9px; }

  .steps { list-style: none; margin: 0 0 4px; padding: 0 2px; text-align: left; display: grid; gap: 2px; }
  .step {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    color: var(--faint);
    font-size: 12.5px;
    transition: color .35s ease;
  }
  .step .pip {
    position: relative;
    width: 15px; height: 15px;
    justify-self: center;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    opacity: .8;
    transition: opacity .3s, border-color .3s, background .3s;
  }
  .step .lbl { letter-spacing: .15px; }
  .step .meta { font: 11px/1 ui-monospace, "JetBrains Mono", monospace; color: var(--faint); letter-spacing: .3px; }

  .step[data-state="active"] { color: var(--gold); }
  .step[data-state="active"] .pip {
    opacity: 1; background: var(--gold); border-color: var(--gold);
    animation: pipPulse 2s ease-out infinite;
  }
  .step[data-state="active"] .pip::after {
    content: ""; position: absolute; inset: 3.5px; border-radius: 50%; background: #0b0a07;
  }
  @keyframes pipPulse {
    0% { box-shadow: 0 0 0 0 rgba(201,169,97,.5); }
    70% { box-shadow: 0 0 0 7px rgba(201,169,97,0); }
    100% { box-shadow: 0 0 0 0 rgba(201,169,97,0); }
  }

  .step[data-state="done"] { color: var(--dim); }
  .step[data-state="done"] .pip { opacity: 1; border-color: var(--gold); background: transparent; }
  .step[data-state="done"] .pip::after {
    content: "";
    position: absolute; left: 3.2px; top: 4.6px;
    width: 6px; height: 3.2px;
    border-left: 1.6px solid var(--gold);
    border-bottom: 1.6px solid var(--gold);
    transform: rotate(-45deg);
  }

  .step[data-state="fail"] { color: var(--error); }
  .step[data-state="fail"] .pip { opacity: 1; border-color: var(--error); }
  .step[data-state="fail"] .pip::after {
    content: ""; position: absolute; inset: 3.2px;
    background:
      linear-gradient(45deg, transparent 42%, var(--error) 42% 58%, transparent 58%),
      linear-gradient(-45deg, transparent 42%, var(--error) 42% 58%, transparent 58%);
  }

  .status {
    margin-top: 18px;
    background: linear-gradient(180deg, #14120e 0%, #100f0c 100%);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px 15px;
    font-size: 12.8px;
    color: var(--dim);
    min-height: 46px;
    display: flex;
    align-items: center;
    gap: 11px;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
    transition: border-color .3s, color .3s;
  }
  .status[data-tone="warn"] { color: var(--warn); border-color: #3a3120; }
  .status[data-tone="error"] {
    color: var(--error); border-color: #3d2523;
    background: linear-gradient(180deg, #1a1210 0%, #120e0d 100%);
  }

  .dot {
    flex: 0 0 auto;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold);
    animation: pulse 2.1s ease-out infinite;
  }
  .status[data-tone="warn"] .dot { background: var(--warn); }
  .status[data-tone="error"] .dot { background: var(--error); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(201,169,97,.45); }
    70% { box-shadow: 0 0 0 8px rgba(201,169,97,0); }
    100% { box-shadow: 0 0 0 0 rgba(201,169,97,0); }
  }

  .logwrap {
    margin-top: 12px;
    background: #0a0a08;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    text-align: left;
  }
  .loghead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 13px;
    border-bottom: 1px solid var(--line);
    font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase;
    color: var(--faint);
  }
  .loghead .ltitle { display: flex; align-items: center; gap: 7px; }
  .loghead .ltitle i { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); transition: background .3s; }
  body[data-stage="checking"] .loghead .ltitle i,
  body[data-stage="booting"] .loghead .ltitle i,
  body[data-stage="loading"] .loghead .ltitle i {
    background: var(--gold); animation: pulse 1.8s ease-out infinite;
  }
  .loghead button {
    padding: 3px 10px; font-size: 10px; letter-spacing: .5px;
    border-radius: 6px; text-transform: uppercase;
    background: transparent; border: 1px solid var(--line); color: var(--faint);
    cursor: pointer; transition: color .2s, border-color .2s;
  }
  .loghead button:hover { color: var(--dim); border-color: #37322a; }
  .log {
    margin: 0;
    /* right gutter keeps text clear of the scrollbar */
    padding: 9px 24px 9px 12px;
    max-height: 118px;
    overflow-y: auto;
    font: 11.5px/1.65 ui-monospace, "JetBrains Mono", monospace;
    color: #948c7e;
    white-space: pre-wrap;
    word-break: break-word;
    -webkit-user-select: text;
    user-select: text;
    overscroll-behavior: contain;
  }
  .log::-webkit-scrollbar { width: 9px; }
  .log::-webkit-scrollbar-thumb { background: #241f18; border-radius: 4px; }
  .log::-webkit-scrollbar-thumb:hover { background: #332c22; }
  .log:empty::before { content: "waiting for output…"; color: #3d3830; }
  .log .err { color: var(--error); }
  .log .ok { color: var(--ok); }
  .log .dim { color: #5f5749; }

  .actions { margin-top: 16px; display: none; gap: 9px; justify-content: center; }
  .actions.show { display: flex; }
  button.act {
    font: inherit; font-size: 12.5px;
    color: var(--text);
    background: #17140f;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 18px;
    cursor: pointer;
    transition: background .18s, border-color .18s, transform .07s;
  }
  button.act:hover { background: #1f1b14; border-color: #3a3327; }
  button.act:active { transform: translateY(1px); }
  button.act.primary {
    border-color: #4a3d22;
    background: linear-gradient(180deg, #2a2314 0%, #1d1810 100%);
    color: #e9d9a8;
  }
  button.act.primary:hover { background: linear-gradient(180deg, #352c19 0%, #241d12 100%); }

  .foot {
    margin-top: 14px;
    font-size: 10.5px;
    color: #4a453c;
    letter-spacing: .7px;
    display: flex;
    gap: 9px;
    align-items: center;
    justify-content: center;
  }
  .foot .sep { opacity: .4; }
  .foot code { color: #857c6c; font-family: ui-monospace, "JetBrains Mono", monospace; letter-spacing: .2px; }

  /* ── polish layer ───────────────────────────────────────────── */

  /* vignette — pulls the eye to the card instead of the flat void */
  .scene::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 96% 78% at 50% 45%, transparent 40%, rgba(0,0,0,.38) 100%);
    pointer-events: none;
  }

  /* a soft band of light sweeping down the card while booting.
     Purely kinetic — it reads as "working" without a spinner. */
  /* (scan band removed — it read as a moving stripe, not progress) */

  /* hairline rail linking the three pips */
  .steps { position: relative; }
  /* single hairline through the pip centres — no glow, no second line.
     The pips are centred in a 22px column, so 11px is their true centre. */
  .steps::before {
    content: "";
    position: absolute;
    left: 11px; top: 16px; bottom: 16px;
    width: 1px;
    background: linear-gradient(180deg, rgba(201,169,97,.20), rgba(201,169,97,.06));
    pointer-events: none;
  }

  /* indeterminate hairline under the status box — the honest "in progress"
     signal, since we cannot know a real percentage. */
  .progress {
    position: relative;
    height: 2px;
    margin-top: 9px;
    border-radius: 2px;
    overflow: hidden;
    background: #14120e;
    opacity: 0;
    transition: opacity .35s ease;
  }
  body[data-stage="checking"] .progress,
  body[data-stage="booting"]  .progress,
  body[data-stage="loading"]  .progress { opacity: 1; }
  .progress::after {
    content: "";
    position: absolute; top: 0; bottom: 0; left: -40%; width: 38%;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: slide 1.7s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { left: -40%; }
    100% { left: 100%; }
  }

  /* counter-rotating inner ring gives the mark depth without noise */
  .mark .ring {
    position: absolute; inset: 7px;
    border-radius: 17px;
    border: 1px solid rgba(201,169,97,.14);
    animation: spinBack 9s linear infinite;
  }
  @keyframes spinBack { to { transform: rotate(-360deg); } }
  body[data-stage="idle"]  .mark .ring,
  body[data-stage="error"] .mark .ring { animation-play-state: paused; }

  /* active step drifts a touch right — cheap sense of motion */
  .step { transition: color .35s ease; }

  /* blinking caret in the log head while output is streaming */
  .logwrap { position: relative; }
  body[data-stage="booting"] .loghead .ltitle i,
  body[data-stage="loading"] .loghead .ltitle i { background: var(--gold); }

  .foot #elapsed { color: #6f6657; font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    .card::before, .progress::after, .mark .ring { animation: none; }
    .card > * { animation: none; }
  }

  .scene {
    background:
      radial-gradient(ellipse 130% 85% at 50% -12%, #13110c 0%, transparent 58%),
      radial-gradient(ellipse 95% 70% at 82% 112%, #0b1210 0%, transparent 60%),
      var(--bg);
  }

  .scene::before {
    content: "";
    position: absolute; inset: 0;
    opacity: .045;
    mix-blend-mode: overlay;
    pointer-events: none;
    background-size: 150px 150px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='150' height='150' filter='url(%23n)'/></svg>");
  }

  .g1 { opacity: .62; }

  .mark {
    width: 96px; height: 96px;
    margin: 0 auto 28px;
    border-radius: 27px;
    border-color: #332c1e;
    background: linear-gradient(158deg, #1e1a13 0%, #0a0908 100%);
    box-shadow:
      0 26px 74px -24px rgba(0,0,0,.98),
      inset 0 1px 0 rgba(255,255,255,.07),
      0 0 110px -30px rgba(201,169,97,.75);
  }
  .mark svg { width: 46px; height: 46px; }
  .mark::after { border-radius: 27px; }

  h1 {
    font-size: 27px;
    font-weight: 500;
    letter-spacing: 7.5px;
    text-indent: 7.5px;
    margin: 0 0 8px;
    background: linear-gradient(180deg, #fdf9ef 0%, #bfae86 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .sub {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    font-size: 10px;
    letter-spacing: 3.4px;
    text-transform: uppercase;
    color: #6b6457;
    margin: 0 0 30px;
  }
  .sub::before,
  .sub::after {
    content: "";
    height: 1px;
    width: 32px;
    flex: 0 0 auto;
    background: linear-gradient(90deg, transparent, #3c3629);
  }
  .sub::after { background: linear-gradient(90deg, #3c3629, transparent); }

  .step[data-state="active"] .lbl { text-shadow: 0 0 18px rgba(201,169,97,.45); }

  .status {
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.03),
      0 12px 30px -20px rgba(0,0,0,.9);
  }

  .logwrap {
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.02),
      0 16px 36px -24px rgba(0,0,0,.95);
  }

  /* ── glass card: gives the content a real container ─────────── */
  .card {
    padding: 46px 42px 34px;
    border-radius: 22px;
    background:
      linear-gradient(180deg, rgba(22,19,14,.72) 0%, rgba(10,9,8,.55) 100%);
    border: 1px solid rgba(201,169,97,.09);
    box-shadow:
      0 48px 120px -48px rgba(0,0,0,.95),
      0 0 0 1px rgba(0,0,0,.4),
      inset 0 1px 0 rgba(255,255,255,.045);
    backdrop-filter: blur(22px) saturate(120%);
    -webkit-backdrop-filter: blur(22px) saturate(120%);
  }
  /* a hairline of gold light along the top edge */
  .card::after {
    content: "";
    position: absolute;
    top: 0; left: 14%; right: 14%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,169,97,.45), transparent);
    pointer-events: none;
  }

  /* stronger presence for the mark */
  .mark::before {
    inset: -34px;
    background: radial-gradient(circle, rgba(201,169,97,.22) 0%, transparent 66%);
  }

  /* title gets a slow living gradient */
  h1 {
    background-size: 200% auto;
    animation: titleShift 8s ease-in-out infinite;
  }
  @keyframes titleShift {
    0%, 100% { background-position: 0% center; }
    50%      { background-position: 100% center; }
  }

  /* steps read as a real progress rail */


  @media (prefers-reduced-motion: reduce) {
    h1 { animation: none; }
  }

  /* ═══════════════════════════════════════════════════════════
     AESTHETIC LAYER — quiet luxury, cosmic minimal
     ═══════════════════════════════════════════════════════════ */

  /* ── backdrop: deep space, slow warm aurora ── */
  .scene {
    background:
      radial-gradient(ellipse 140% 90% at 50% -25%, #191510 0%, transparent 52%),
      radial-gradient(ellipse 100% 70% at 12% 108%, #0c1311 0%, transparent 58%),
      radial-gradient(ellipse 90% 65% at 92% 102%, #141019 0%, transparent 56%),
      #060609;
  }
  .g1 {
    width: 1100px; height: 1100px; top: -55%; margin-left: -550px;
    background: radial-gradient(circle, rgba(201,169,97,.13) 0%, rgba(201,169,97,0) 62%);
    opacity: .78; filter: blur(72px);
    animation: drift1 34s ease-in-out infinite alternate;
  }
  .g2 {
    width: 900px; height: 900px; bottom: -45%; right: -20%;
    background: radial-gradient(circle, rgba(125,211,160,.09) 0%, transparent 66%);
    opacity: .72;
    animation: drift2 40s ease-in-out infinite alternate;
  }
  .grid {
    background-size: 64px 64px;
    background-image:
      linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
    mask-image: radial-gradient(ellipse 52% 46% at 50% 46%, #000 10%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 52% 46% at 50% 46%, #000 10%, transparent 100%);
  }

  /* ── card: slab of dark glass, light caught along the top ── */
  .card {
    width: min(420px, 88vw);
    padding: 26px 32px 20px;
    border-radius: 26px;
    background:
      linear-gradient(168deg, rgba(30,26,19,.78) 0%, rgba(12,11,10,.62) 46%, rgba(8,8,9,.72) 100%);
    border: 1px solid rgba(201,169,97,.10);
    box-shadow:
      0 60px 140px -60px rgba(0,0,0,1),
      0 24px 60px -32px rgba(0,0,0,.9),
      inset 0 1px 0 rgba(255,255,255,.055),
      inset 0 -34px 64px -52px rgba(201,169,97,.38);
    backdrop-filter: blur(28px) saturate(125%);
    -webkit-backdrop-filter: blur(28px) saturate(125%);
  }
  .card::after {
    top: 0; left: 18%; right: 18%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,226,163,.55), transparent);
  }

  /* ── mark ── */
  .mark {
    width: 68px; height: 68px;
    border-radius: 20px;
    margin-bottom: 18px;
    background: radial-gradient(circle at 32% 22%, #2a2418 0%, #131110 58%, #0a0908 100%);
    border: 1px solid rgba(201,169,97,.22);
    box-shadow:
      0 30px 80px -26px rgba(0,0,0,1),
      inset 0 1px 0 rgba(255,255,255,.09),
      inset 0 -12px 26px -18px rgba(201,169,97,.5),
      0 0 130px -34px rgba(201,169,97,.85);
  }
  .mark svg { width: 34px; height: 34px; }
  .mark::before { inset: -26px; }
  .mark::after { border-radius: 20px; }
  .mark .ring { inset: 6px; border-radius: 14px; border-color: rgba(201,169,97,.16); }

  /* ── type ── */
  h1 {
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 9px;
    text-indent: 9px;
    margin: 0 0 6px;
    background: linear-gradient(180deg, #fffdf7 0%, #e4d5ad 44%, #a08e64 100%);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 20px rgba(201,169,97,.22));
  }
  .sub {
    font-size: 9px;
    letter-spacing: 3.8px;
    gap: 12px;
    color: #6a6355;
    margin-bottom: 20px;
  }
  .sub::before, .sub::after { width: 40px; }

  /* ── steps ── */
  .step { font-size: 12px; padding: 5.5px 0; }
  .step[data-state="pending"] { color: #46423a; }
  .step[data-state="active"] { color: #e8cf94; }
  .step[data-state="active"] .pip {
    box-shadow: 0 0 0 4px rgba(201,169,97,.08), 0 0 22px rgba(201,169,97,.5);
  }
  .step[data-state="done"] .lbl { color: #9a9183; }

  /* ── status panel ── */
  .status {
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(23,20,15,.9) 0%, rgba(13,12,10,.85) 100%);
    border-color: rgba(201,169,97,.12);
    padding: 14px 16px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.035),

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          dots.push({ x: ox + c * GAP, y: oy + r * GAP })
        }
      }
    }

    function draw(now) {
      const t = (now - t0) * SPEED
      ctx.clearRect(0, 0, W, H)

      // Two wave fronts, different angles, so the pattern never
      // reads as a single bar sweeping across.
      // Normalise by the diagonal so the wave count is the same on any
      // window size. Without this the phase span depends on pixel width and
      // the crests bunch up on one side of the screen.
      const diag = Math.sqrt(W * W + H * H) || 1
      const ax = Math.cos(0.62), ay = Math.sin(0.62)
      const bx = Math.cos(-0.35), by = Math.sin(-0.35)
      const k1 = 6.5 / diag
      const k2 = 4.2 / diag

      for (let i = 0; i < dots.length; i++) {
        const d = dots[i]
        const p1 = d.x * ax + d.y * ay
        const p2 = d.x * bx + d.y * by
        const w1 = Math.sin(p1 * k1 * 2.4 - t)
        const w2 = Math.sin(p2 * k2 * 2.4 - t * 0.63 + 1.7)
        let v = (w1 + w2) * 0.5          // -1 .. 1
        v = v < 0 ? 0 : v * v            // only the crest glows

        if (v < 0.01) continue

        const r = BASE_R + (MAX_R - BASE_R) * v
        const a = 0.08 + 0.42 * v
        ctx.beginPath()
        ctx.arc(d.x, d.y, r, 0, 6.28318)
        ctx.fillStyle = 'rgba(' + accentRgb() + ',' + a.toFixed(3) + ')'
        ctx.fill()
      }

      raf = requestAnimationFrame(draw)
    }

    function start() {
      build()
      if (reduce) {
        // static: paint one frame at t=0 and stop
        draw(t0)
        if (raf) cancelAnimationFrame(raf)
        raf = null
        return
      }
      if (raf) cancelAnimationFrame(raf)
      raf = requestAnimationFrame(draw)
    }

    let rz = null
    window.addEventListener('resize', () => {
      clearTimeout(rz)
      rz = setTimeout(start, 160)
    })

    start()
  })()

  const api = window.sableDesktop

  // ── theme bridge ───────────────────────────────────────────
  // The main process owns the app's real theme (the app stores it in
  // localStorage on http://localhost, which this file:// page cannot read).
  // It sends resolved colors here; we paint :root with them.
  function applyTheme(t) {
    if (!t || typeof t !== "object") return
    const r = document.documentElement.style
    const set = (k, v) => { if (v) r.setProperty(k, v) }
    set("--t-bg", t.bg)
    set("--t-panel", t.panel)
    set("--t-line", t.border)
    set("--t-text", t.text)
    set("--t-dim", t.dim)
    set("--t-faint", t.faint)
    set("--t-muted", t.muted)
    set("--t-accent", t.accent)
    set("--t-accent-rgb", t.accentRgb)
    set("--t-ok", t.ok)
    set("--t-ok-rgb", t.okRgb)
    set("--t-danger", t.danger)
    if (t.mode === "light") {
      document.documentElement.setAttribute("data-mode", "light")
    } else {
      document.documentElement.removeAttribute("data-mode")
    }
  }
  if (api && api.onTheme) api.onTheme(applyTheme)
  if (api && api.getTheme) {
    api.getTheme().then(applyTheme).catch(() => {})
  }
  const body = document.body
  const statusEl = document.getElementById('status')
  const msgEl = document.getElementById('msg')
  const actions = document.getElementById('actions')
  const portEl = document.getElementById('port')
  const phaseEl = document.getElementById('phase')
  const logEl = document.getElementById('log')
  const toggle = document.getElementById('toggle')

  const stepEls = {
    1: document.querySelector('.step[data-step="1"]'),
    2: document.querySelector('.step[data-step="2"]'),
    3: document.querySelector('.step[data-step="3"]'),
  }
  const metaEls = {
    1: document.querySelector('[data-meta="1"]'),
    2: document.querySelector('[data-meta="2"]'),
    3: document.querySelector('[data-meta="3"]'),
  }

  let failedStep = 0

  function setStep(n, state) {
    const el = stepEls[n]
    if (el) el.dataset.state = state
  }

  function resetSteps() {
    failedStep = 0
    for (const n of [1, 2, 3]) {
      setStep(n, 'pending')
      if (metaEls[n]) metaEls[n].textContent = ''
    }
    body.dataset.stage = 'idle'
    phaseEl.textContent = 'initialising'
  }

  function syncSteps(text, tone) {
    const t = String(text || '').toLowerCase()

    if (tone === 'error') {
      let target = failedStep || 1
      for (const n of [1, 2, 3]) {
        if (stepEls[n] && stepEls[n].dataset.state === 'active') target = n
      }
      setStep(target, 'fail')
      failedStep = target
      body.dataset.stage = 'error'
      phaseEl.textContent = 'failed'
      return
    }

    if (/looking for/.test(t)) {
      setStep(1, 'active')
      body.dataset.stage = 'checking'
      phaseEl.textContent = 'probing'
      return
    }

    if (/connected to a running/.test(t)) {
      setStep(1, 'done')
      setStep(2, 'pending')
      setStep(3, 'active')
      body.dataset.stage = 'loading'
      phaseEl.textContent = 'attached'
      return
    }

    if (/no server on that port|starting one/.test(t)) {
      setStep(1, 'done')
      setStep(2, 'active')
      body.dataset.stage = 'booting'
      phaseEl.textContent = 'starting'
      return
    }

    if (/falling back|starter failed/.test(t)) {
      setStep(1, 'done')
      setStep(2, 'active')
      body.dataset.stage = 'booting'
      phaseEl.textContent = 'fallback'
      return
    }

    if (/booting|server starting/.test(t)) {
      setStep(1, 'done')
      setStep(2, 'active')
      body.dataset.stage = 'booting'
      phaseEl.textContent = 'starting'
      return
    }

    if (/server ready|loading sable/.test(t)) {
      setStep(1, 'done')
      setStep(2, 'done')
      setStep(3, 'active')
      body.dataset.stage = 'loading'
      phaseEl.textContent = 'loading'
      return
    }
  }

  toggle.onclick = () => {
    const hidden = logEl.style.display === 'none'
    logEl.style.display = hidden ? 'block' : 'none'
    toggle.textContent = hidden ? 'hide' : 'show'
  }

  function renderLog(text) {
    if (!text) { logEl.textContent = ''; return }
    const atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 24
    logEl.innerHTML = ''
    for (const line of text.split('\n')) {
      const span = document.createElement('span')
      span.textContent = line + '\n'
      if (/FATAL|ERROR|Traceback|refused|No such file/i.test(line)) span.className = 'err'
      else if (/\[ok\]|ready|valid|online/i.test(line)) span.className = 'ok'
      else if (/^\s*$|^=====/.test(line)) span.className = 'dim'
      logEl.appendChild(span)
    }
    if (atBottom) logEl.scrollTop = logEl.scrollHeight
  }

  function setStatus({ text, tone }) {
    msgEl.textContent = text
    statusEl.dataset.tone = tone || 'info'
    actions.classList.toggle('show', tone === 'error')
    syncSteps(text, tone)

    const m = /(\d+)s\b/.exec(String(text || ''))
    if (m && body.dataset.stage === 'booting') metaEls[2].textContent = m[1] + 's'
    if (tone === 'error') metaEls[3].textContent = ''
  }

  // Dust motes — seeded once, randomised position/size/duration so the field
  // elapsed clock — starts on first status, stops when the stage settles.
  const elapsedEl = document.getElementById('elapsed')
  const t0 = Date.now()
  let elapsedTimer = null
  function startClock() {
    if (elapsedTimer) return
    elapsedTimer = setInterval(() => {
      elapsedEl.textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's'
    }, 100)
  }
  function stopClock() {
    if (!elapsedTimer) return
    clearInterval(elapsedTimer)
    elapsedTimer = null
  }
  startClock()

  const _origSetStatus = setStatus
  setStatus = function (payload) {
    const tone = payload && payload.tone
    if (tone === 'error') stopClock()
    return _origSetStatus(payload)
  }

  if (api) {
    api.onStatus(setStatus)
    api.onLog((p) => renderLog(p && p.text))
    api.info().then((i) => { portEl.textContent = i.port }).catch(() => {})
  }

  document.getElementById('retry').onclick = () => {
    resetSteps()
    setStatus({ text: 'Retrying…', tone: 'info' })
    actions.classList.remove('show')
    api && api.retry()
  }

  document.getElementById('log').onclick = () => {
    if (!api) return
    api.info().then((i) => {
      if (i.log) api.openExternal('file://' + i.log)
    }).catch(() => {})
  }
</script>
</body>
</html>
