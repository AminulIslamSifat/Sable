[project]
name = "sable"
version = "0.2.0"
description = "Sable agentic chat platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "playwright>=1.49.0",
    "fastembed>=0.8.0",
    "numpy>=2.4.6",
    "pydantic>=2.0",
    "sentence-transformers>=5.6.1",
    "lxml>=6.1.1",
]

[tool.uv]
package = false
