itle", "size": "xl", "text": "\u2014"}, {"kind": "text", "color": "secondary", "size": "xs", "text": "Health score"}]}]}]}, {"kind": "segmented-control", "options": [{"label": "Overview", "value": "Overview"}, {"label": "Missions", "value": "Missions"}, {"label": "Logs", "value": "Logs"}], "__expr__options": "[{\"label\":\"Overview\",\"value\":\"Overview\"},{\"label\":\"Missions\",\"value\":\"Missions\"},{\"label\":\"Logs\",\"value\":\"Logs\"}]", "value": "Overview", "__expr__value": "tab", "onChange": null, "__expr__onChange": "setTab", "block": true}, {"kind": "box", "gap": 3, "__expr__gap": "3", "children": [{"kind": "title", "size": "lg", "text": "Agent network"}, {"kind": "box", "key": "Planner", "border": true, "radius": "lg", "padding": 3, "children": [{"kind": "row", "align": "center", "gap": 3, "children": [{"kind": "icon", "name": "brain-circuit", "size": "xl", "color": "#A78BFA"}, {"kind": "box", "flex": "1", "gap": 1, "children": [{"kind": "text", "text": "**Planner**"}, {"kind": "text", "color": "secondary", "size": "sm", "text": "Breaking down the goal"}]}, {"kind": "box", "background": "surface-tertiary", "radius": "full", "size": "9px"}]}]}, {"kind": "box", "key": "Executor", "border": true, "radius": "lg", "padding": 3, "children": [{"kind": "row", "align": "center", "gap": 3, "children": [{"kind": "icon", "name": "terminal", "size": "xl", "color": "#60A5FA"}, {"kind": "box", "flex": "1", "gap": 1, "children": [{"kind": "text", "text": "**Executor**"}, {"kind": "text", "color": "secondary", "size": "sm", "text": "Performing tool actions"}]}, {"kind": "box", "background": "surface-tertiary", "radius": "full", "size": "9px"}]}]}, {"kind": "box", "key": "Verifier", "border": true, "radius": "lg", "padding": 3, "children": [{"kind": "row", "align": "center", "gap": 3, "children": [{"kind": "icon", "name": "shield-check", "size": "xl", "color": "#34D399"}, {"kind": "box", "flex": "1", "gap": 1, "children": [{"kind": "text", "text": "**Verifier**"}, {"kind": "text", "color": "secondary", "size": "sm", "text": "Checking output quality"}]}, {"kind": "box", "background": "surface-tertiary", "radius": "full", "size": "9px"}]}]}, {"kind": "button", "block": true, "onClick": false, "__expr__onClick": "()=>setRunning(!running)", "color": "success", "__expr__color": "running?\"danger\":\"success\"", "text": "Resume system"}]}, {"kind": "divider", "color": "subtle"}, {"kind": "text", "color": "secondary", "size": "xs", "text": "Interactive UI demo. Agent statuses and logs are simulated locally; no actual background agents are running."}]}], "state": {"tab": "Overview", "running": false, "missions": [{"name": "Analyze repository", "status": "Completed"}, {"name": "Inspect dependencies", "status": "Running"}, {"name": "Generate implementation plan", "status": "Queued"}], "logs": ["[10:42:01] Agent initialized", "[10:42:02] Repository context loaded", "[10:42:03] Waiting for next action"]}}];
var root=document.getElementById('root');
PANELS.forEach(function(p){
  var c=document.createElement('div');c.className='md-content';root.appendChild(c);
  window.SableComponents.render({components:[{type:'layout',data:{nodes:p.nodes,state:p.state||{}}}]},c);
});
if(window.lucide)lucide.createIcons();
setTimeout(function(){
  if(window.lucide)lucide.createIcons();
  var out=[];
  var grids=document.querySelectorAll('.rc-grid');
  grids.forEach(function(g,gi){
    out.push('GRID '+gi+' width='+g.offsetWidth+' cols='+getComputedStyle(g).gridTemplateColumns);
    var items=g.querySelectorAll(':scope > .rc-griditem');
    items.forEach(function(it,i){
      out.push('  item'+i+' w='+it.offsetWidth+' boxw='+(it.firstElementChild?it.firstElementChild.offsetWidth:'-'));
    });
  });
  document.getElementById('out').textContent=out.join('\n');
}, 600);
</script></body></html>
