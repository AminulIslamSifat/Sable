<svg viewBox="0 0 32 32" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e8cd97"/>
    <stop offset="100%" stop-color="#c9a464"/>
  </linearGradient>
</defs>

<!-- Main hex (pointy-top, radius ~14, centered at 16,16) -->
<polygon fill="#181825" stroke="url(#grad)" stroke-width="6" stroke-linejoin="round"
  points="16,2 26,8 26,24 16,30 6,24 6,8"/>

<!-- Filled corner dots (radius 3) -->
<circle cx="16" cy="2" r="3" fill="#e8cd97"/>
<circle cx="26" cy="8" r="3" fill="#e8cd97"/>
<circle cx="26" cy="24" r="3" fill="#e8cd97"/>
<circle cx="16" cy="30" r="3" fill="#e8cd97"/>
<circle cx="6" cy="24" r="3" fill="#e8cd97"/>
<circle cx="6" cy="8" r="3" fill="#e8cd97"/>

<!-- Solid core -->
<circle cx="16" cy="16" r="4" fill="#e8cd97"/>

</svg>
